name: CI

on:
  push:
    branches:
      - main
      - module_one_sprint_three_branch
      - module_one_sprint_four_branch
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and run tests
        run: ./gradlew --no-daemon check
